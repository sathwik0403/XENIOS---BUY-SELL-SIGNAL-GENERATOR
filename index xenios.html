<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script></head><body><div id="c"></div><script>
function send(t,d){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:t},d),"*")}
window.addEventListener("message",function(e){
  if(!e.data||e.data.type!=="streamlit:render")return;
  var a=e.data.args,f=JSON.parse(a.fig_json),h=a.height,el=document.getElementById("c");
  el.style.height=h+"px";f.layout.height=h;f.layout.autosize=true;
  Plotly.react(el,f.data,f.layout,{scrollZoom:true,displaylogo:false,responsive:true});
  send("streamlit:setFrameHeight",{height:h});
});
send("streamlit:componentReady",{apiVersion:1});
</script></body></html>
